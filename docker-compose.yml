services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleet_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_local_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - fleet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet} -d ${POSTGRES_DB:-fleet_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD:-fleet_local_password}@db:5432/${POSTGRES_DB:-fleet_intelligence}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - fleet_uploads:/app/uploads
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  fleet_postgres_data:
  fleet_uploads:
